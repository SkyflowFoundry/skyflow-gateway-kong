# Declarative config template for the Claude Code -> Kong -> Skyflow -> OpenAI
# gateway. `setup.sh` substitutes the __PLACEHOLDER__ values from your
# environment into kong.yaml (gitignored). Secrets never land in this file:
# the service-account JSON resolves at runtime through Kong's env vault
# ({vault://env/...}); the OpenAI key is supplied by each caller per request
# (bring-your-own-key), never stored in the gateway.
_format_version: "3.0"

services:
  # Front door: point Claude Code's ANTHROPIC_BASE_URL here. De-identifies the
  # request (Skyflow Detect), loops through Kong to the ai-proxy route, and
  # re-identifies the response. Nested-proxy pattern -- see the repo README.
  - name: claude-front
    url: http://127.0.0.1:8000/_claude_upstream
    routes:
      - name: claude
        paths: ["/claude"]
        strip_path: true
        protocols: ["http", "https"]
    plugins:
      - name: skyflow-deidentify
        config:
          vault_id: __SKYFLOW_VAULT_ID__
          cluster_id: __SKYFLOW_CLUSTER_ID__
          account_id: __SKYFLOW_ACCOUNT_ID__
          credentials:
            service_account_json: "{vault://env/SKYFLOW_SA_JSON}"
            context:
              tenant: __CTX_TENANT__
            context_headers:
              caller.user: X-Demo-User
            context_kong:
              caller.route: route_name
          profile: anthropic
          response_json_paths: ["$.content[*].text"]
          deidentify:
            entities: [NAME, EMAIL_ADDRESS, PHONE_NUMBER, SSN, CREDIT_CARD, DOB]
            token_format: VAULT_TOKEN
          reidentify:
            enabled: true
            strategy: reidentify_text
            on_error: deny
            # tool_inputs defaults to `tokenized`: agents' tools receive vault
            # tokens, never raw PII. Set to plain_text only if you trust every
            # tool's egress path.
          on_skyflow_error: deny
          timeout_ms: 15000
          deadline_ms: 30000
      - name: file-log
        config:
          path: /tmp/skyflow-gateway.json

  # Internal: ai-proxy alone. llm_format=anthropic accepts Claude-native
  # payloads and translates to/from the OpenAI provider.
  - name: claude-upstream
    url: http://localhost:32000
    routes:
      - name: claude-upstream
        paths: ["/_claude_upstream"]
        strip_path: true
        protocols: ["http", "https"]
    plugins:
      - name: ai-proxy
        config:
          llm_format: anthropic
          route_type: llm/v1/chat
          logging: { log_statistics: true, log_payloads: false }
          # Bring-your-own-key: no auth block, so the gateway injects NOTHING.
          # Each caller supplies their own OpenAI key via the Authorization
          # header (Claude Code: ANTHROPIC_AUTH_TOKEN=<their key>). No key ->
          # the provider rejects the request, which doubles as access control.
          model:
            provider: openai
            name: __OPENAI_MODEL__
          max_request_body_size: 16777216

  # Probe: same de-identification, echo upstream, re-identify off -- so you
  # can SEE the tokens any upstream would receive.
  - name: probe-deid
    url: http://echo:8080
    routes:
      - name: probe-deid
        paths: ["/probe/deid"]
        strip_path: true
        protocols: ["http", "https"]
    plugins:
      - name: skyflow-deidentify
        config:
          vault_id: __SKYFLOW_VAULT_ID__
          cluster_id: __SKYFLOW_CLUSTER_ID__
          account_id: __SKYFLOW_ACCOUNT_ID__
          credentials:
            service_account_json: "{vault://env/SKYFLOW_SA_JSON}"
            context:
              tenant: __CTX_TENANT__
          profile: anthropic
          deidentify:
            entities: [NAME, EMAIL_ADDRESS, PHONE_NUMBER, SSN, CREDIT_CARD, DOB]
            token_format: VAULT_TOKEN
          reidentify: { enabled: false }
          on_skyflow_error: deny
          timeout_ms: 15000
          deadline_ms: 30000
