# Kong AI Gateway secured by Skyflow -- STREAMING-NATIVE deployment.
#
# What makes this the only supported path: the plugin CODE is not in the
# image. schema.lua and handler.lua are uploaded to the control plane and streamed
# to every data plane, so BOTH the config and the plugin itself are pushed from
# Konnect. That is the only arrangement that works on a gateway whose image you do
# not control (Konnect Dedicated Cloud Gateways), and it turns a plugin change
# into an API call rather than a build-push-deploy.
#
# Requires three data-plane settings; see deploy/streaming/Dockerfile for why each
# one matters and what breaks without it:
#   KONG_CUSTOM_PLUGIN_STREAMING_ENABLED=on
#   KONG_UNTRUSTED_LUA=lax          <- streamed handlers run sandboxed; `strict`
#                                      forbids require() and rejects the config
#   KONG_PLUGINS=bundled            <- must NOT name skyflow-deidentify
#
# Built greenfield deliberately. The previous control plane had accumulated a
# stale non-streaming node still registered alongside the new one, four file-log
# instances, and a duplicate hostname; streaming worked first time on a clean
# control plane with the identical image and env, and reported P309 on the dirty
# one. Kept lean here on purpose.
#
# CREDENTIAL MODEL -- STS delegation (RFC 8693) only:
#   The caller presents an enterprise IdP token (Entra) as `Authorization: Bearer`.
#   The gateway exchanges it at Skyflow's STS endpoint for a short-lived bearer
#   whose `ctx` IS the caller's signed claims. Consequences worth stating:
#     * this gateway holds NO Skyflow credential. Compromising it yields no vault
#       access.
#     * identity is IdP-verified, not gateway-asserted: Skyflow logs the human in
#       Subject with the full claim set as Context, and the service account stays
#       the Actor (delegation).
#     * one credential for the client, which is what single-credential clients
#       (Claude Desktop's gateway-OIDC mode) require.
#
#   Provider credentials ARE gateway-held (Anthropic + OpenAI); the `model` in the
#   request body selects which internal upstream handles the call.
#
# file-log appears three times, not once, and they are NOT redundant:
#   ai-front     -> the skyflow entity counts for the request
#   up-anthropic -> the ai.proxy egress payload, i.e. what the provider actually
#                   received. This is the audit trail that proves tokens-only.
#   up-openai    -> the same for the OpenAI leg
# A single global instance would also log /healthz every 10s and lose the
# distinction, so this stays explicit.
_format_version: "3.0"

services:
  # ---------------------------------------------------------------- front door
  - name: ai-front
    url: http://127.0.0.1:8000/_up_anthropic
    routes:
      - name: ai
        paths: ["/ai"]
        strip_path: true
        protocols: ["http", "https"]
    plugins:
      # No client key-auth: the caller's IdP token IS the credential. A junk or
      # misdirected token is rejected by the plugin's local iss/aud/exp
      # precheck before any network hop, so anonymous traffic costs nothing.
      #
      # Provider selected from the request body's `model` -- the standard
      # AI-gateway pattern. (Kong's free ai-proxy pins one provider per plugin
      # instance and ai-proxy-advanced is enterprise-only, so this bundled
      # pre-function rewrites the internal loopback path instead.)
      - name: pre-function
        config:
          access:
            - |
              -- Route to a provider by the body's `model`. Kong's router cannot
              -- match on a body, and free ai-proxy pins one provider per plugin
              -- instance, so the choice has to happen in Lua and the two
              -- ai-proxy instances have to live on separate internal routes.
              --
              -- Strips whatever the FIRST path segment is rather than matching
              -- "^/ai": the old pattern hard-coded one route, so this same
              -- snippet on /probe produced /_up_anthropic/probe/v1/messages and
              -- 404'd -- which is why /probe used to be Anthropic-only.
              local body = kong.request.get_body()
              local model = body and body.model
              if not model or model == "" then
                -- get_body() returns nil once the body exceeds
                -- client_body_buffer_size, and the old code then defaulted to
                -- Anthropic. A gpt-* request silently answered by Claude is
                -- worse than a clear error.
                kong.log.err("kong-ai-gateway: no model in body; cannot choose a provider")
                return kong.response.exit(400, {
                  message = "request blocked: no `model` in the request body, "
                            .. "so no provider could be selected" })
              end
              local tail = kong.request.get_path():gsub("^/[^/]+", "")
              local upstream = model:find("^gpt") and "/_up_openai" or "/_up_anthropic"
              kong.service.request.set_path(upstream .. tail)
              kong.log.info("kong-ai-gateway: model=", model, " -> ", upstream)
      # Flow log to stdout -> CloudWatch: route, status, latency, and the
      # skyflow entity counts. No request/response bodies -- the gateway's own
      # logs stay PII-free by construction.
      - name: file-log
        config: { path: /dev/stdout }
      - name: skyflow-deidentify
        config:
          vault_id: i65a450543bf48b68c3fa58c5ed7ce30
          cluster_id: ebfc9bee4242
          account_id: j58448d299cf4e42ac433948d9c70d94
          credentials:
            sts:
              service_account_id: mab1f43f916b4ba082b500e1ab5be59f
              token_header: authorization
              expected_issuer: "https://login.microsoftonline.com/5b772553-7aad-487a-91a9-3b93382ac28b/v2.0"
              expected_audience: "9ff1c091-fc74-4dae-929b-9cd58382b621"
          profile: anthropic
          # FAIL-CLOSED: over the limit the request is rejected with 413 rather
          # than partially de-identified.
          #
          # 128, not 512. Measured on real traffic: Detect costs ~104ms per span
          # at the median and ~403ms at p90, and spans are processed
          # SEQUENTIALLY, so 512 spans is ~53s at the median and ~206s at p90
          # against a 60s deadline_ms -- i.e. over budget for most of the
          # distribution, turning a hard 413 into a slow timeout. Observed real
          # span counts are median 2, p90 18, max 49, so 128 leaves >2.5x
          # headroom over the worst request actually seen.
          #
          # Raise this only together with concurrent span processing; until then
          # the ceiling is a latency budget, not a capacity one.
          # 32MB, matching both the nginx limit and Claude Desktop's own ceiling.
          # This was never set, so it took the schema default of 1MB -- two orders
          # of magnitude below what the client will send. A request over it is
          # refused with 413 "body too large" (fail-closed, correct, but the limit
          # was far too low: real agent turns already reach 250KB+ and a single
          # PDF attachment clears 1MB easily).
          max_body_size: 33554432
          # 512. The earlier 128 was sized for SEQUENTIAL processing, where 512
          # spans meant ~53s at the median against a 60s deadline. Spans now run
          # in concurrent waves of max_concurrency, so the cost is
          # ceil(spans/8) round trips: ~6.7s at 512 spans, not ~53s.
          #
          # Headroom matters more than it looks. Observed span counts are median
          # 2 / p90 18 / max 49 for message content alone, but any path touching
          # the `tools` array multiplies that ~10x because Claude Desktop resends
          # ~30 tool definitions every turn -- which is exactly how a
          # fifteen-character request reached 139 spans and was refused 413.
          max_spans: 512
          # Spans are de-identified in concurrent waves of this width, so
          # de-identification costs roughly ceil(spans/8) Detect round-trips
          # instead of one per span. Set explicitly rather than left to the
          # schema default because this used to be DEAD CONFIG -- declared,
          # documented as a DoS control, shipped in the partner schema, and
          # referenced nowhere in the handler. Must stay <= keepalive_pool_size
          # (16) or waves will contend for connections.
          max_concurrency: 8
          # response_json_paths is deliberately UNSET. "$.content[*].text" was
          # listed here, but that is already the anthropic profile's response
          # default and the two MERGE -- so every assistant text block was
          # collected twice and detokenized twice, doubling response-leg latency
          # and Detect spend for byte-identical output. effective_paths() now
          # dedupes, so this line was also redundant; only add paths the profile
          # does not already cover.
          deidentify:
            entities: [NAME, LOCATION, EMAIL_ADDRESS, PHONE_NUMBER, SSN, CREDIT_CARD, DOB,
                       ACCOUNT_NUMBER, BANK_ACCOUNT, PASSPORT_NUMBER, DRIVER_LICENSE]
            token_format: VAULT_TOKEN
          media:
            mode: deidentify
            unsupported: strip
            masking_method: BLACKBOX
            redact_object_types: [FACE, SIGNATURE]
          reidentify:
            enabled: true
            strategy: reidentify_text
            on_error: deny
            # Default stays `tokenized`: an unknown tool is assumed to ship its
            # arguments somewhere we do not control, so it gets vault tokens.
            tool_inputs: tokenized
            # The exceptions are tools that execute on the CALLER'S OWN MACHINE.
            # There, tokens are not protection but corruption: an Edit call whose
            # old_string is `[NAME_X2A0iim]` matches nothing, and a Write call
            # persists the token into the user's real file. Nothing leaves the
            # device, so the caller -- who is already authorized for this data,
            # having just supplied the IdP token that unlocked it -- may see it.
            #
            # Listed one by one rather than as `mcp__workspace__*`, deliberately:
            # a prefix rule silently opts in every tool a server adds LATER, and
            # `mcp__workspace__web_fetch` shows that servers do mix local and
            # egressing tools under one name. Prefix rules are supported (longest
            # wins, exact beats prefix) but each new local tool should be a
            # visible decision, not an inherited default.
            tool_inputs_by_tool:
              Read: plain_text
              Edit: plain_text
              Write: plain_text
              NotebookEdit: plain_text
              Glob: plain_text
              Grep: plain_text
              mcp__workspace__bash: plain_text
              # Egressing tools, pinned explicitly. Redundant against the
              # default above -- kept so that flipping that default can never
              # silently start leaking through these.
              WebSearch: tokenized
              WebFetch: tokenized
              mcp__workspace__web_fetch: tokenized
              # Artifacts are published to claude.ai, so they egress too.
              mcp__cowork__create_artifact: tokenized
              mcp__cowork__update_artifact: tokenized
          on_skyflow_error: deny
          timeout_ms: 15000
          deadline_ms: 60000

  # -------------------------------------------------------------------- probe
  # Same de-identification with re-identify OFF, so the response shows the
  # tokens the provider actually received. Takes a caller IdP token like
  # /claude does.
  - name: probe-front
    url: http://127.0.0.1:8000/_up_anthropic
    routes:
      - name: probe
        paths: ["/probe"]
        strip_path: true
        protocols: ["http", "https"]
    plugins:
      - name: pre-function
        config:
          access:
            - |
              -- Route to a provider by the body's `model`. Kong's router cannot
              -- match on a body, and free ai-proxy pins one provider per plugin
              -- instance, so the choice has to happen in Lua and the two
              -- ai-proxy instances have to live on separate internal routes.
              --
              -- Strips whatever the FIRST path segment is rather than matching
              -- "^/ai": the old pattern hard-coded one route, so this same
              -- snippet on /probe produced /_up_anthropic/probe/v1/messages and
              -- 404'd -- which is why /probe used to be Anthropic-only.
              local body = kong.request.get_body()
              local model = body and body.model
              if not model or model == "" then
                -- get_body() returns nil once the body exceeds
                -- client_body_buffer_size, and the old code then defaulted to
                -- Anthropic. A gpt-* request silently answered by Claude is
                -- worse than a clear error.
                kong.log.err("kong-ai-gateway: no model in body; cannot choose a provider")
                return kong.response.exit(400, {
                  message = "request blocked: no `model` in the request body, "
                            .. "so no provider could be selected" })
              end
              local tail = kong.request.get_path():gsub("^/[^/]+", "")
              local upstream = model:find("^gpt") and "/_up_openai" or "/_up_anthropic"
              kong.service.request.set_path(upstream .. tail)
              kong.log.info("kong-ai-gateway: model=", model, " -> ", upstream)
      - name: skyflow-deidentify
        config:
          vault_id: i65a450543bf48b68c3fa58c5ed7ce30
          cluster_id: ebfc9bee4242
          account_id: j58448d299cf4e42ac433948d9c70d94
          credentials:
            sts:
              service_account_id: mab1f43f916b4ba082b500e1ab5be59f
              token_header: authorization
              expected_issuer: "https://login.microsoftonline.com/5b772553-7aad-487a-91a9-3b93382ac28b/v2.0"
              expected_audience: "9ff1c091-fc74-4dae-929b-9cd58382b621"
          profile: anthropic
          # FAIL-CLOSED: over the limit the request is rejected with 413 rather
          # than partially de-identified.
          #
          # 128, not 512. Measured on real traffic: Detect costs ~104ms per span
          # at the median and ~403ms at p90, and spans are processed
          # SEQUENTIALLY, so 512 spans is ~53s at the median and ~206s at p90
          # against a 60s deadline_ms -- i.e. over budget for most of the
          # distribution, turning a hard 413 into a slow timeout. Observed real
          # span counts are median 2, p90 18, max 49, so 128 leaves >2.5x
          # headroom over the worst request actually seen.
          #
          # Raise this only together with concurrent span processing; until then
          # the ceiling is a latency budget, not a capacity one.
          # 32MB, matching both the nginx limit and Claude Desktop's own ceiling.
          # This was never set, so it took the schema default of 1MB -- two orders
          # of magnitude below what the client will send. A request over it is
          # refused with 413 "body too large" (fail-closed, correct, but the limit
          # was far too low: real agent turns already reach 250KB+ and a single
          # PDF attachment clears 1MB easily).
          max_body_size: 33554432
          # 512. The earlier 128 was sized for SEQUENTIAL processing, where 512
          # spans meant ~53s at the median against a 60s deadline. Spans now run
          # in concurrent waves of max_concurrency, so the cost is
          # ceil(spans/8) round trips: ~6.7s at 512 spans, not ~53s.
          #
          # Headroom matters more than it looks. Observed span counts are median
          # 2 / p90 18 / max 49 for message content alone, but any path touching
          # the `tools` array multiplies that ~10x because Claude Desktop resends
          # ~30 tool definitions every turn -- which is exactly how a
          # fifteen-character request reached 139 spans and was refused 413.
          max_spans: 512
          # Spans are de-identified in concurrent waves of this width, so
          # de-identification costs roughly ceil(spans/8) Detect round-trips
          # instead of one per span. Set explicitly rather than left to the
          # schema default because this used to be DEAD CONFIG -- declared,
          # documented as a DoS control, shipped in the partner schema, and
          # referenced nowhere in the handler. Must stay <= keepalive_pool_size
          # (16) or waves will contend for connections.
          max_concurrency: 8
          deidentify:
            entities: [NAME, LOCATION, EMAIL_ADDRESS, PHONE_NUMBER, SSN, CREDIT_CARD, DOB,
                       ACCOUNT_NUMBER, BANK_ACCOUNT, PASSPORT_NUMBER, DRIVER_LICENSE]
            token_format: VAULT_TOKEN
          media:
            mode: deidentify
            unsupported: strip
            masking_method: BLACKBOX
            redact_object_types: [FACE, SIGNATURE]
          reidentify: { enabled: false }
          on_skyflow_error: deny
          timeout_ms: 15000
          deadline_ms: 60000

  # ------------------------------------------------------- internal upstreams
  # Reachable only from the nested proxy hop (127.0.0.1). An external request
  # arrives from the App Runner ingress and is refused, so de-identification
  # cannot be bypassed -- and unlike key-auth this needs no credential
  # forwarded inward, which is impossible when the caller holds only an IdP
  # token.
  - name: up-anthropic
    url: http://localhost:32000
    routes:
      - name: up-anthropic
        paths: ["/_up_anthropic"]
        strip_path: true
        protocols: ["http", "https"]
    plugins:
      - name: ip-restriction
        config: { allow: ["127.0.0.1/32"], status: 403,
                  message: "internal route: not externally reachable" }
      # log_payloads here records the TOKENIZED payloads -- the exact bytes that
      # egress to the provider and what it answers. Safe to log precisely
      # because de-identification already happened on the front route.
      - name: file-log
        config: { path: /dev/stdout }
      - name: ai-proxy
        config:
          llm_format: anthropic
          route_type: llm/v1/chat
          logging: { log_statistics: true, log_payloads: true }
          auth:
            # Anthropic authenticates with x-api-key, never Bearer
            header_name: x-api-key
            header_value: "{vault://env/ANTHROPIC_API_KEY}"
            allow_override: false
          model:
            # no `name`: ai-proxy forwards the caller's model, so any model the
            # provider offers works through this one endpoint
            provider: anthropic
            options:
              anthropic_version: "2023-06-01"
              max_tokens: 8192
          max_request_body_size: 16777216

  - name: up-openai
    url: http://localhost:32000
    routes:
      - name: up-openai
        paths: ["/_up_openai"]
        strip_path: true
        protocols: ["http", "https"]
    plugins:
      - name: ip-restriction
        config: { allow: ["127.0.0.1/32"], status: 403,
                  message: "internal route: not externally reachable" }
      - name: file-log
        config: { path: /dev/stdout }
      - name: ai-proxy
        config:
          llm_format: anthropic
          route_type: llm/v1/chat
          logging: { log_statistics: true, log_payloads: true }
          auth:
            header_name: Authorization
            # a vault reference must be the WHOLE value -- Kong does not
            # interpolate "Bearer {vault://...}", so the env var carries the
            # complete header value
            header_value: "{vault://env/OPENAI_AUTH_HEADER}"
            allow_override: false
          model:
            provider: openai
          max_request_body_size: 16777216

  # ------------------------------------------------------------- model list
  # Anthropic's /v1/models, served by the gateway. ai-proxy only handles
  # POST /v1/messages, so a GET here would 405 -- and clients that offer model
  # discovery (Claude Desktop) call this at launch to populate their picker.
  # Served statically because the set of models this gateway exposes is a
  # deployment decision, not a provider lookup.
  #
  # Anthropic IDs only: Claude Desktop rejects a configured non-Anthropic model
  # ("not an Anthropic model"). OpenAI models still work through /claude by
  # putting `"model": "gpt-*"` in the request body -- they just aren't
  # advertised here.
  #
  # Deliberately unauthenticated: a list of model names carries nothing
  # sensitive, and requiring the IdP token here would make discovery fail
  # before the user has signed in.
  - name: models
    url: http://localhost:32001
    routes:
      - name: models
        paths: ["/ai/v1/models", "/probe/v1/models"]
        strip_path: true
        protocols: ["http", "https"]
    plugins:
      - name: request-termination
        config:
          status_code: 200
          content_type: "application/json"
          body: |
            {"data":[
              {"type":"model","id":"claude-sonnet-4-5","display_name":"Claude Sonnet 4.5 — Kong AI Gateway, secured by Skyflow"},
              {"type":"model","id":"claude-opus-4-5","display_name":"Claude Opus 4.5 — Kong AI Gateway, secured by Skyflow"},
              {"type":"model","id":"claude-haiku-4-5","display_name":"Claude Haiku 4.5 — Kong AI Gateway, secured by Skyflow"}
            ],"has_more":false}

  # ------------------------------------------------------------------- health
  - name: healthz
    url: http://localhost:32001
    routes:
      - name: healthz
        paths: ["/healthz"]
        strip_path: true
        protocols: ["http", "https"]
    plugins:
      - name: request-termination
        config: { status_code: 200, message: "ok" }
