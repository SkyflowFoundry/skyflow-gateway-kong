# Mock LLM (OpenAI chat-completions shaped) WITH gzip — faithfully emulates real
# OpenAI, which returns a gzip-encoded body (ai-proxy sends
# `Accept-Encoding: gzip, identity` upstream, see kong openai driver). Echoes the
# last (de-identified) user message back in choices[].message.content so the
# vault tokens round-trip for the re-identify phase.
server {
    listen 8080;
    default_type application/json;

    # Compress like OpenAI does when the caller (ai-proxy) accepts gzip.
    gzip on;
    gzip_types application/json;
    gzip_min_length 1;
    gzip_proxied any;

    location / {
        content_by_lua_block {
            local cjson = require "cjson"
            ngx.req.read_body()
            local ok, body = pcall(cjson.decode, ngx.req.get_body_data() or "{}")
            local content = "(no message)"
            if ok and type(body) == "table" and type(body.messages) == "table" then
                local m = body.messages[#body.messages]
                if m and m.content then content = m.content end
            end
            -- PROOF: log exactly what the "LLM" received (should be tokens only).
            ngx.log(ngx.ERR, "MOCK-LLM RECEIVED: ", content)
            ngx.say(cjson.encode({
                id = "chatcmpl-mock", object = "chat.completion", created = 0,
                model = "mock-llm",
                choices = { {
                    index = 0,
                    message = { role = "assistant", content = content },
                    finish_reason = "stop",
                } },
                usage = { prompt_tokens = 0, completion_tokens = 0, total_tokens = 0 },
            }))
        }
    }
}
