# Konnect Hybrid demo — self-managed DATA PLANE (runs on YOUR machine).
#
# This DP connects to your Konnect control plane and runs the custom
# skyflow-deidentify plugin (mounted from ../../plugin). It also brings up a
# mock Skyflow Detect service and an echo upstream so you can demo end-to-end
# without a real vault.
#
# Prereqs (see ./README.md):
#   1. Create a hybrid control plane in Konnect and generate a data-plane cert.
#   2. Put the cert/key in ./certs/tls.crt and ./certs/tls.key
#   3. cp .env.example .env  and fill in the cluster endpoints from Konnect.
#   4. Upload the custom plugin schema to the CP, then `deck gateway sync`
#      ./deck/kong.yaml (see README).
#   5. docker compose up -d
#
# The control plane / telemetry endpoints + certs come from Konnect — this file
# only wires them in. Endpoints are templated from .env.

services:
  kong-dp:
    image: ${KONG_GATEWAY_IMAGE:-kong/kong-gateway:3.14}
    container_name: skyflow-kong-dp
    environment:
      KONG_ROLE: data_plane
      KONG_DATABASE: "off"
      KONG_KONNECT_MODE: "on"
      KONG_VITALS: "off"
      KONG_CLUSTER_MTLS: pki
      KONG_CLUSTER_CONTROL_PLANE: ${KONNECT_CONTROL_PLANE_ENDPOINT}
      KONG_CLUSTER_SERVER_NAME: ${KONNECT_CONTROL_PLANE_SERVER_NAME}
      KONG_CLUSTER_TELEMETRY_ENDPOINT: ${KONNECT_TELEMETRY_ENDPOINT}
      KONG_CLUSTER_TELEMETRY_SERVER_NAME: ${KONNECT_TELEMETRY_SERVER_NAME}
      KONG_CLUSTER_CERT: /kong-certs/tls.crt
      KONG_CLUSTER_CERT_KEY: /kong-certs/tls.key
      KONG_LUA_SSL_TRUSTED_CERTIFICATE: system
      # demo only: skips DP<->CP/telemetry TLS verification. Do NOT carry into production.
      KONG_TLS_CERTIFICATE_VERIFY: "off"
      # Must match the control plane's router flavor (Konnect 3.14 -> expressions)
      KONG_ROUTER_FLAVOR: ${KONG_ROUTER_FLAVOR:-expressions}
      # --- custom plugin wiring ---
      KONG_PLUGINS: bundled,skyflow-deidentify
      KONG_LUA_PACKAGE_PATH: /kong-plugins/?.lua;;
      KONG_PROXY_LISTEN: 0.0.0.0:8000, 0.0.0.0:8443 ssl
      # Keep agent-sized request bodies (large system prompt + tool schemas, tens
      # of KB) in memory instead of spooling to a temp file — so both the
      # skyflow-deidentify plugin and ai-proxy can read the body. Without this,
      # real coding-agent requests fail ("body unavailable" / ai-proxy "unable to
      # parse request body"); small curls are unaffected. See demo/act2.
      KONG_NGINX_HTTP_CLIENT_BODY_BUFFER_SIZE: 16m
      KONG_NGINX_HTTP_CLIENT_MAX_BODY_SIZE: 16m
    volumes:
      # repo `plugin/` dir -> package path root, so
      # kong.plugins.skyflow-deidentify.{handler,schema} resolves
      - ../../plugin:/kong-plugins:ro
      - ./certs:/kong-certs:ro
    ports:
      # If 8000/8443 are taken on your host, set PROXY_HTTP_PORT / PROXY_HTTPS_PORT
      # in .env (then use that port in the demo curl).
      - "${PROXY_HTTP_PORT:-8000}:8000"    # proxy (HTTP) -> send demo traffic here
      - "${PROXY_HTTPS_PORT:-8443}:8443"   # proxy (HTTPS)
    restart: unless-stopped
    depends_on:
      - mock-skyflow
      - echo
      - mock-llm

  # Mock Skyflow Detect API (de-identify). The plugin points at this via
  # config.skyflow_base_url_override = http://mock-skyflow:8080
  mock-skyflow:
    image: openresty/openresty:alpine
    container_name: skyflow-mock
    volumes:
      - ./mock-skyflow/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "8080"

  # Echo upstream — reflects back exactly what it received, so you can SEE that
  # the upstream got tokens (not the original PII).
  echo:
    image: mendhak/http-https-echo:31
    container_name: skyflow-echo
    environment:
      HTTP_PORT: "8080"
    expose:
      - "8080"

  # Mock LLM (OpenAI chat-completions shaped) — lets us prove the full de-id ->
  # LLM -> re-id round-trip WITHOUT ai-proxy (which collides with our response
  # phase). It echoes the tokenized prompt back in choices[].message.content.
  mock-llm:
    image: openresty/openresty:alpine
    container_name: skyflow-mock-llm
    volumes:
      - ./mock-llm/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "8080"
