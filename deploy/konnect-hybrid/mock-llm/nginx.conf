# Mock LLM (OpenAI chat-completions shaped) for proving the de-id -> LLM -> re-id
# round-trip WITHOUT ai-proxy. It echoes the last (already de-identified) user
# message back inside choices[].message.content, so the response carries the
# vault tokens for the plugin's response phase to re-identify. Uncompressed.
server {
    listen 8080;
    default_type application/json;

    location / {
        content_by_lua_block {
            local cjson = require "cjson"
            ngx.req.read_body()
            local ok, body = pcall(cjson.decode, ngx.req.get_body_data() or "{}")
            local content = "(no message)"
            if ok and type(body) == "table" and type(body.messages) == "table" then
                local m = body.messages[#body.messages]
                if m and m.content then content = m.content end
            end
            -- Echo the (de-identified) prompt back verbatim so the token
            -- round-trips cleanly; no prefix so the re-identified content is
            -- exactly the original text.
            ngx.say(cjson.encode({
                id = "chatcmpl-mock", object = "chat.completion", created = 0,
                model = "mock-llm",
                choices = { {
                    index = 0,
                    message = { role = "assistant", content = content },
                    finish_reason = "stop",
                } },
                usage = { prompt_tokens = 0, completion_tokens = 0, total_tokens = 0 },
            }))
        }
    }
}
