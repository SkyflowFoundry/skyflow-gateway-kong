# Production-shaped: real Skyflow vault (no mock) + ai-proxy to a real LLM.
#
# The plugin's Detect client is verified against a live vault (see VERIFY-DETECT.md
# for the exact request/response contract).
#
# ⚠️  `deck gateway sync` deletes anything not in this file. This file defines
#     ONLY the real AI route, so syncing it REPLACES the demo/echo routes.
#
# Sync:
#   export KONNECT_PAT=kpat_...
#   export DECK_SKYFLOW_VAULT_ID=...  DECK_SKYFLOW_CLUSTER_ID=...  DECK_SKYFLOW_API_KEY=...
#   export DECK_OPENAI_API_KEY=sk-...
#   deck gateway sync --konnect-token "$KONNECT_PAT" \
#     --konnect-control-plane-name skyflow-hybrid \
#     deploy/konnect-hybrid/deck/real-vault.yaml

_format_version: "3.0"

services:
  - name: ai
    url: http://localhost:32000   # placeholder; ai-proxy overrides the upstream
    routes:
      - name: ai-chat
        paths: ["/ai/chat"]
        strip_path: true
    plugins:
      - name: skyflow-deidentify
        config:
          vault_id: '${{ env "DECK_SKYFLOW_VAULT_ID" }}'
          cluster_id: '${{ env "DECK_SKYFLOW_CLUSTER_ID" }}'
          # no skyflow_base_url_override -> derives https://<cluster_id>.vault.skyflowapis.com
          credentials: { api_key: '${{ env "DECK_SKYFLOW_API_KEY" }}' }
          profile: openai
          deidentify: { entities: [NAME, EMAIL_ADDRESS, PHONE_NUMBER], token_format: ENTITY_UNQ_COUNTER }
          reidentify: { enabled: true, strategy: mapping_only, default_treatment: plain_text }
          on_skyflow_error: deny
      - name: ai-proxy
        config:
          route_type: "llm/v1/chat"
          model:
            provider: openai
            name: gpt-4o-mini
          auth:
            header_name: Authorization
            header_value: 'Bearer ${{ env "DECK_OPENAI_API_KEY" }}'
