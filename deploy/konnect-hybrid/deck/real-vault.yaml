# Production-shaped: real Skyflow vault (no mock) + ai-proxy to a real LLM.
#
# The plugin's Detect client is verified against a live vault (see VERIFY-DETECT.md
# for the exact request/response contract).
#
# ⚠️  `deck gateway sync` deletes anything not in this file. This file defines
#     BOTH routes below, so syncing it REPLACES the demo/echo routes.
#
# Two routes:
#   /vault/chat  -> skyflow-deidentify ONLY, upstream = mock-llm (no ai-proxy).
#                   Proves the real-vault de-id -> LLM -> re-id round-trip.
#   /ai/chat     -> skyflow-deidentify (de-id only) + ai-proxy to a real LLM +
#                   skyflow-reidentify (re-id, priority 760 < ai-proxy 770 so it
#                   runs AFTER ai-proxy). Full de-id + re-id round-trip via a
#                   real LLM. (skyflow-reidentify is a SECOND custom plugin --
#                   upload its schema.lua to the control plane once, like the
#                   first; see README.)
#
# Sync:
#   export KONNECT_PAT=kpat_...
#   export DECK_SKYFLOW_VAULT_ID=...  DECK_SKYFLOW_CLUSTER_ID=...  DECK_SKYFLOW_API_KEY=...
#   export DECK_OPENAI_API_KEY=sk-...
#   deck gateway sync --konnect-token "$KONNECT_PAT" \
#     --konnect-control-plane-name skyflow-hybrid \
#     deploy/konnect-hybrid/deck/real-vault.yaml

_format_version: "3.0"

services:
  # Real vault, no ai-proxy: the clean end-to-end de-id + re-id proof.
  - name: vault-chat
    url: http://mock-llm:8080
    routes:
      - name: vault-chat
        paths: ["/vault/chat"]
        strip_path: true
    plugins:
      - name: skyflow-deidentify
        config:
          vault_id: '${{ env "DECK_SKYFLOW_VAULT_ID" }}'
          cluster_id: '${{ env "DECK_SKYFLOW_CLUSTER_ID" }}'
          credentials: { api_key: '${{ env "DECK_SKYFLOW_API_KEY" }}' }
          profile: openai
          deidentify: { entities: [NAME, EMAIL_ADDRESS, PHONE_NUMBER], token_format: VAULT_TOKEN }
          reidentify: { enabled: true, strategy: reidentify_text, default_treatment: plain_text }
          on_skyflow_error: deny

  - name: ai
    url: http://localhost:32000   # placeholder; ai-proxy overrides the upstream
    routes:
      - name: ai-chat
        paths: ["/ai/chat"]
        strip_path: true
    plugins:
      # 1) De-identify the request (runs before ai-proxy). In-plugin re-id is OFF
      #    here -- the separate skyflow-reidentify plugin handles the response so
      #    it runs AFTER ai-proxy.
      - name: skyflow-deidentify
        config:
          vault_id: '${{ env "DECK_SKYFLOW_VAULT_ID" }}'
          cluster_id: '${{ env "DECK_SKYFLOW_CLUSTER_ID" }}'
          # no skyflow_base_url_override -> derives https://<cluster_id>.vault.skyflowapis.com
          credentials: { api_key: '${{ env "DECK_SKYFLOW_API_KEY" }}' }
          profile: openai
          # VAULT_TOKEN stores each value<->token pair in the vault, so it can be
          # re-identified server-side later (ENTITY_* tokens can't be).
          deidentify: { entities: [NAME, EMAIL_ADDRESS, PHONE_NUMBER], token_format: VAULT_TOKEN }
          reidentify: { enabled: false }
          on_skyflow_error: deny
      # 2) ai-proxy calls the real LLM (sees only tokens).
      - name: ai-proxy
        config:
          route_type: "llm/v1/chat"
          model:
            provider: openai
            name: gpt-4o-mini
          auth:
            header_name: Authorization
            header_value: 'Bearer ${{ env "DECK_OPENAI_API_KEY" }}'
      # 3) Re-identify the LLM response (priority 760 < ai-proxy 770 -> runs after
      #    ai-proxy has produced the final body). Vault-backed via reidentify/string.
      - name: skyflow-reidentify
        config:
          vault_id: '${{ env "DECK_SKYFLOW_VAULT_ID" }}'
          cluster_id: '${{ env "DECK_SKYFLOW_CLUSTER_ID" }}'
          credentials: { api_key: '${{ env "DECK_SKYFLOW_API_KEY" }}' }
          profile: openai
          on_error: return_tokenized
