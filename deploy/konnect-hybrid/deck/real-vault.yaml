# Real Skyflow vault + real LLM. NO ai-proxy.
#
# Why no ai-proxy: ai-proxy's response handling is incompatible with the buffered
# response our re-identify needs -- the client gets "no response body found when
# transforming response" even with re-id split into its own lower-priority
# plugin (ai-proxy fails regardless of ordering). So both routes use the SAME
# proven path: skyflow-deidentify does de-id (request) AND re-id (response). For
# a real LLM we route straight to OpenAI and inject the API key with the bundled
# request-transformer plugin.
#
# ⚠️  `deck gateway sync` deletes anything not in this file. This file is the full
#     desired state (both routes below).
#
# Two routes:
#   /vault/chat  -> upstream = mock-llm (no external LLM needed). Cleanest proof.
#   /ai/chat     -> upstream = api.openai.com (real GPT reply). Include "model"
#                   in the request body (the demo curl below does).
#
# Sync:
#   export KONNECT_PAT=kpat_...
#   export DECK_SKYFLOW_VAULT_ID=...  DECK_SKYFLOW_CLUSTER_ID=...  DECK_SKYFLOW_API_KEY=...
#   export DECK_OPENAI_API_KEY=sk-...
#   deck gateway sync --konnect-token "$KONNECT_PAT" \
#     --konnect-control-plane-name skyflow-hybrid \
#     deploy/konnect-hybrid/deck/real-vault.yaml
#
# Demo:
#   /vault/chat (mock LLM):
#     curl -s localhost:8000/vault/chat -H 'content-type: application/json' \
#       -d '{"messages":[{"role":"user","content":"Hi my name is Joe McCarron"}]}' | jq .
#   /ai/chat (real OpenAI -- note the "model" field):
#     curl -s localhost:8000/ai/chat -H 'content-type: application/json' \
#       -d '{"model":"gpt-4o-mini","messages":[{"role":"user","content":"Hi my name is Joe McCarron"}]}' | jq .

_format_version: "3.0"

services:
  # Mock LLM upstream -- proves the round-trip with no external dependency.
  - name: vault-chat
    url: http://mock-llm:8080
    routes:
      - name: vault-chat
        paths: ["/vault/chat"]
        strip_path: true
    plugins:
      - name: skyflow-deidentify
        config:
          vault_id: '${{ env "DECK_SKYFLOW_VAULT_ID" }}'
          cluster_id: '${{ env "DECK_SKYFLOW_CLUSTER_ID" }}'
          credentials: { api_key: '${{ env "DECK_SKYFLOW_API_KEY" }}' }
          profile: openai
          deidentify: { entities: [NAME, EMAIL_ADDRESS, PHONE_NUMBER], token_format: VAULT_TOKEN }
          reidentify: { enabled: true, strategy: reidentify_text, default_treatment: plain_text }
          on_skyflow_error: deny

  # Real LLM upstream (OpenAI, direct). Same plugin does de-id + re-id; the
  # bundled request-transformer injects the OpenAI Authorization header so the
  # client never holds the key.
  - name: ai
    url: https://api.openai.com/v1/chat/completions
    routes:
      - name: ai-chat
        paths: ["/ai/chat"]
        strip_path: true
    plugins:
      - name: skyflow-deidentify
        config:
          vault_id: '${{ env "DECK_SKYFLOW_VAULT_ID" }}'
          cluster_id: '${{ env "DECK_SKYFLOW_CLUSTER_ID" }}'
          # no skyflow_base_url_override -> derives https://<cluster_id>.vault.skyflowapis.com
          credentials: { api_key: '${{ env "DECK_SKYFLOW_API_KEY" }}' }
          profile: openai
          deidentify: { entities: [NAME, EMAIL_ADDRESS, PHONE_NUMBER], token_format: VAULT_TOKEN }
          reidentify: { enabled: true, strategy: reidentify_text, default_treatment: plain_text }
          on_skyflow_error: deny
      - name: request-transformer
        config:
          add:
            headers:
              - 'Authorization:Bearer ${{ env "DECK_OPENAI_API_KEY" }}'
