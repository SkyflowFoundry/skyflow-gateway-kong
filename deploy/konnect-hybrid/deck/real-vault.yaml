# Real Skyflow vault + real LLM, WITH Kong ai-proxy in the path.
#
# The ai-proxy composition problem (Kong #14380) — and the fix:
#   ai-proxy transforms the upstream LLM response inside its header_filter
#   (kong/llm shared-filters parse-json-response -> normalize-json-response).
#   Our re-identify must run in the `response` phase (it needs cosockets to call
#   Skyflow, which are banned in body_filter). On ONE route, the response-phase
#   rewrite consumes/rewrites the buffered body before ai-proxy's header_filter
#   reads it, so ai-proxy gets nil and returns 500
#   "no response body found when transforming response".
#   This ONLY triggers when the upstream body is gzip-encoded — which real OpenAI
#   always is (ai-proxy sends `Accept-Encoding: gzip` upstream). That's why it was
#   so hard to pin down: an uncompressed mock never reproduces it.
#   Reproduced + fixed offline in deploy/local-dbless (see /broken vs /ai routes).
#
#   FIX = nested proxy. Two routes, two independent buffered cycles:
#     /ai/chat       front route: skyflow-deidentify does de-id (request) AND
#                    re-id (response). NO ai-proxy here. Its upstream is the
#                    internal /_ai_upstream route (Kong loops back to itself).
#     /_ai_upstream  internal route: ai-proxy ONLY -> real OpenAI. No skyflow
#                    plugin, so nothing competes for ai-proxy's buffered body.
#   The front route's upstream response is ai-proxy's already-transformed, plain
#   (uncompressed) OpenAI JSON, which re-identify handles exactly like /vault/chat.
#
# ⚠️  `deck gateway sync` deletes anything not in this file. This file is the full
#     desired state (all three routes below).
#
# Sync:
#   export KONNECT_PAT=kpat_...
#   export DECK_SKYFLOW_VAULT_ID=...  DECK_SKYFLOW_CLUSTER_ID=...
#   export DECK_SKYFLOW_SERVICE_ACCOUNT_ID=...   # STS-only: the plugin holds no
#                                                # Skyflow credential of its own
#   export DECK_OPENAI_API_KEY=sk-...
#   deck gateway sync --konnect-token "$KONNECT_PAT" \
#     --konnect-control-plane-name skyflow-hybrid \
#     deploy/konnect-hybrid/deck/real-vault.yaml
#
# Demo:
#   /vault/chat (mock LLM, no ai-proxy):
#     curl -s localhost:8000/vault/chat -H 'content-type: application/json' \
#       -d '{"messages":[{"role":"user","content":"Hi my name is Joe McCarron"}]}' | jq .
#   /ai/chat (real OpenAI via ai-proxy):
#     curl -s localhost:8000/ai/chat -H 'content-type: application/json' \
#       -d '{"messages":[{"role":"user","content":"Hi my name is Joe McCarron"}]}' | jq .

_format_version: "3.0"

services:
  # 1) Baseline: mock LLM upstream, no ai-proxy. Cleanest round-trip proof.
  - name: vault-chat
    url: http://mock-llm:8080
    routes:
      - name: vault-chat
        paths: ["/vault/chat"]
        strip_path: true
    plugins:
      - name: skyflow-deidentify
        config: &skyflow_deid_reid
          vault_id: '${{ env "DECK_SKYFLOW_VAULT_ID" }}'
          cluster_id: '${{ env "DECK_SKYFLOW_CLUSTER_ID" }}'
          credentials:
            sts:
              service_account_id: '${{ env "DECK_SKYFLOW_SERVICE_ACCOUNT_ID" }}'
          profile: openai
          # Healthcare-flavored entity set — breadth in one prompt. Empty = detect-all.
          deidentify:
            entities: [NAME, NAME_GIVEN, NAME_MEDICAL_PROFESSIONAL, OCCUPATION,
                       HEALTHCARE_NUMBER, ORGANIZATION_MEDICAL_FACILITY, CONDITION,
                       DRUG, DOSE, DOB, EMAIL_ADDRESS, PHONE_NUMBER]
            token_format: VAULT_TOKEN
          reidentify: { enabled: true, strategy: reidentify_text, default_treatment: plain_text }
          on_skyflow_error: deny

  # 2) FRONT route: de-id + re-id only. Upstream loops back to /_ai_upstream so
  #    ai-proxy runs in a SEPARATE request cycle (see header comment).
  - name: ai-front
    url: http://127.0.0.1:8000/_ai_upstream
    routes:
      # /ai/chat            — bare curl demo (Acts 1 & 3 of the steps script).
      # /ai/v1/chat/completions — OpenAI Chat Completions shape, so any OpenAI-SDK
      #   client is drop-in: point it at base_url http://localhost:8000/ai/v1 and it
      #   POSTs here. Used by the opencode coding-agent demo (see demo/act2). Both
      #   paths strip to the same loopback upstream (/_ai_upstream -> ai-proxy).
      - name: ai-chat
        paths: ["/ai/chat", "/ai/v1/chat/completions"]
        strip_path: true
    plugins:
      - name: skyflow-deidentify
        config: *skyflow_deid_reid   # identical to the proven /vault/chat plugin

  # 3) INTERNAL route: ai-proxy ONLY -> real OpenAI. No skyflow plugin here.
  #    NOTE: this route also proxies to OpenAI WITHOUT de-identification, so in a
  #    real deployment restrict it (internal listener, mTLS, or an allowlist) so
  #    clients can't call it directly and bypass de-id. For the localhost POC it
  #    is left open for simplicity.
  - name: ai-upstream
    url: http://localhost:32000   # placeholder; ai-proxy overrides the upstream
    routes:
      - name: ai-upstream
        paths: ["/_ai_upstream"]
        strip_path: true
    plugins:
      - name: ai-proxy
        config:
          route_type: "llm/v1/chat"
          # Real coding-agent requests carry a large system prompt + tool schemas
          # (tens of KB). ai-proxy's default cap (~8KB) rejects them with
          # "request body doesn't contain valid inputs" once nginx spools the body
          # to a temp file. Raise it so agent-sized bodies parse. Pairs with the
          # DP's KONG_NGINX_HTTP_CLIENT_BODY_BUFFER_SIZE bump (docker-compose.yml).
          max_request_body_size: 16777216
          auth:
            header_name: Authorization
            header_value: 'Bearer ${{ env "DECK_OPENAI_API_KEY" }}'
          model:
            provider: openai
            name: gpt-4o-mini

  # 4) PROOF route: de-identify ONLY (re-identify DISABLED) -> echo upstream.
  #    The echo reflects the request it received, so the response SHOWS the
  #    tokenized body the upstream got — proof that raw PII never leaves the
  #    gateway. (With re-id ON, the echoed tokens get restored and you'd see the
  #    original PII, defeating the demo — hence a dedicated re-id-off route.)
  - name: demo-echo
    url: http://echo:8080
    routes:
      - name: demo-deid
        paths: ["/demo/deid"]
        strip_path: true
    plugins:
      - name: skyflow-deidentify
        config:
          vault_id: '${{ env "DECK_SKYFLOW_VAULT_ID" }}'
          cluster_id: '${{ env "DECK_SKYFLOW_CLUSTER_ID" }}'
          credentials:
            sts:
              service_account_id: '${{ env "DECK_SKYFLOW_SERVICE_ACCOUNT_ID" }}'
          profile: openai
          deidentify:
            entities: [NAME, NAME_GIVEN, NAME_MEDICAL_PROFESSIONAL, OCCUPATION,
                       HEALTHCARE_NUMBER, ORGANIZATION_MEDICAL_FACILITY, CONDITION,
                       DRUG, DOSE, DOB, EMAIL_ADDRESS, PHONE_NUMBER]
            token_format: VAULT_TOKEN
          reidentify: { enabled: false }
          on_skyflow_error: deny

  # 5) RAW route: NO plugin at all -> echo upstream. The echo reflects the raw
  #    request, so the response shows the original PII exactly as an unprotected
  #    upstream (LLM) would receive it. The "before" half of the what-the-LLM-sees
  #    contrast (pairs with /demo/deid, which shows the de-identified version).
  - name: demo-raw
    url: http://echo:8080
    routes:
      - name: demo-raw
        paths: ["/demo/raw"]
        strip_path: true
