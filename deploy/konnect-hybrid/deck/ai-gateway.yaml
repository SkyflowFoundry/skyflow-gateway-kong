# Konnect AI Gateway via decK — de-identify -> ai-proxy(real LLM) -> re-identify,
# using the MOCK Skyflow (http://mock-skyflow:8080) for de-id + re-id.
#
# Uses the nested-proxy pattern (see real-vault.yaml header for the full why):
# ai-proxy and our response-phase re-identify cannot share one route (Kong
# #14380 — ai-proxy 500s "no response body found" when a response-phase plugin
# rewrites the gzip-encoded upstream body it needs). So /ai/chat runs de-id+re-id
# only and loops back to the internal /_ai_upstream route, which runs ai-proxy
# alone. Reproduced + verified offline in deploy/local-dbless.
#
# ⚠️  `deck gateway sync <file>` makes the control plane match THIS FILE exactly
#     and DELETES anything not in it. Sync ONE file at a time.
#
# Sync:
#   export KONNECT_PAT=kpat_...
#   export DECK_OPENAI_API_KEY=sk-...        # decK only reads DECK_-prefixed env vars
#   deck gateway sync --konnect-token "$KONNECT_PAT" \
#     --konnect-control-plane-name skyflow-hybrid \
#     deploy/konnect-hybrid/deck/ai-gateway.yaml
#
# Demo (do NOT set "stream": true — re-identify needs a buffered response):
#   curl -s localhost:8000/ai/chat -H 'Content-Type: application/json' \
#     -d '{"messages":[{"role":"user","content":"Reply to Jane Doe at jane@acme.com"}]}' | jq .

_format_version: "3.0"

services:
  # 1) Original echo demo (de-identify + re-identify with treatments) — no LLM.
  - name: demo-llm
    url: http://echo:8080
    routes:
      - name: chat
        paths: ["/demo/chat"]
        strip_path: true
    plugins:
      - name: skyflow-deidentify
        config:
          vault_id: demo-vault
          cluster_id: demo
          skyflow_base_url_override: "http://mock-skyflow:8080"
          credentials:
            sts:
              service_account_id: "demo-service-account"
              token_uri: "http://mock-skyflow:8080/v1/auth/sts/token"
          profile: openai
          deidentify: { entities: [NAME, EMAIL_ADDRESS, PHONE_NUMBER, SSN, CREDIT_CARD], token_format: VAULT_TOKEN }
          reidentify:
            enabled: true
            strategy: mapping_only
            default_treatment: plain_text
            entity_treatment: { CREDIT_CARD: masked, SSN: redacted }
          on_skyflow_error: deny

  # 2) FRONT route: de-id + re-id only (mock Skyflow). Loops back to /_ai_upstream.
  - name: ai-front
    url: http://127.0.0.1:8000/_ai_upstream
    routes:
      - name: ai-chat
        paths: ["/ai/chat"]
        strip_path: true
    plugins:
      - name: skyflow-deidentify
        config:
          vault_id: demo-vault
          cluster_id: demo
          skyflow_base_url_override: "http://mock-skyflow:8080"
          credentials:
            sts:
              service_account_id: "demo-service-account"
              token_uri: "http://mock-skyflow:8080/v1/auth/sts/token"
          profile: openai
          # VAULT_TOKEN + reidentify_text = vault-backed round-trip (the mock
          # reverses the tokens for this demo).
          deidentify: { entities: [NAME, EMAIL_ADDRESS, PHONE_NUMBER], token_format: VAULT_TOKEN }
          reidentify: { enabled: true, strategy: reidentify_text, default_treatment: plain_text }
          on_skyflow_error: deny

  # 3) INTERNAL route: ai-proxy ONLY -> real OpenAI. No skyflow plugin here.
  #    Restrict this route in a real deployment so clients can't bypass de-id.
  - name: ai-upstream
    url: http://localhost:32000   # placeholder; ai-proxy overrides the upstream
    routes:
      - name: ai-upstream
        paths: ["/_ai_upstream"]
        strip_path: true
    plugins:
      - name: ai-proxy
        config:
          route_type: "llm/v1/chat"
          auth:
            header_name: Authorization
            header_value: 'Bearer ${{ env "DECK_OPENAI_API_KEY" }}'
          model:
            provider: openai
            name: gpt-4o-mini
