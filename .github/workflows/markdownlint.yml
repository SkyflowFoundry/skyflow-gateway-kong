name: markdownlint

# Lint markdown on PRs and on main. Runs the same `make lint-md`
# (markdownlint-cli2) used locally, reading .markdownlint.jsonc / .markdownlintignore.
on:
  pull_request:
    paths:
      - "**/*.md"
      - ".markdownlint*"
      - "Makefile"
      - ".github/workflows/markdownlint.yml"
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - ".markdownlint*"
      - "Makefile"

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: make lint-md
