name: test

# Neither of the two gateway repos ran its tests in CI until this file existed:
# this repo linted markdown, and the sister repo had no workflows at all. Several
# defects reached production as a result, including one that discarded a complete
# model response.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  offline-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Run under `resty` inside the SAME Kong image the data plane runs, not
      # under bare luajit. The Makefile used to invoke `luajit`, which is absent
      # on most machines -- and on a box that has it WITHOUT lua-cjson, the codec
      # test silently skipped and the suite still exited 0. The runtime has to
      # match production or the tests assert against a different library set.
      - name: offline unit tests
        run: |
          docker run --rm -v "$PWD:/w" -w /w \
            --entrypoint resty kong/kong-gateway:3.15.0.2 \
            spec/offline/pure_algorithms_test.lua

      # A test that cannot fail is worse than a missing one. Reintroduce the
      # `tools: [] -> {}` bug that 400'd every Claude Desktop title-generation
      # request and assert the suite NOTICES. The previous version of that test
      # asserted on the cjson library rather than on the handler's codec and
      # passed with the bug reinstated.
      - name: mutation check -- the suite must catch the codec regression
        run: |
          mkdir -p /tmp/mut && cp -r plugin spec /tmp/mut/
          cd /tmp/mut
          sed -i 's/body_json\.decode/cjson.decode/g; s/body_json\.encode/cjson.encode/g' \
            plugin/kong/plugins/skyflow-deidentify/handler.lua
          if docker run --rm -v "$PWD:/w" -w /w \
               --entrypoint resty kong/kong-gateway:3.15.0.2 \
               spec/offline/pure_algorithms_test.lua; then
            echo "::error::the suite PASSED with the tools:[] codec bug reinstated -- it is not testing the handler's codec"
            exit 1
          fi
          echo "ok: the suite fails when the codec fix is reverted"

  config-validity:
    runs-on: ubuntu-latest
    # Konnect credentials are only present on pushes to the canonical repo.
    if: ${{ github.event_name == 'push' && github.repository_owner == 'SkyflowFoundry' }}
    steps:
      - uses: actions/checkout@v4
      - name: install decK
        run: |
          curl -sL https://github.com/Kong/deck/releases/latest/download/deck_linux_amd64.tar.gz \
            | tar -xz -C /usr/local/bin deck
      # `deck gateway diff` does NOT validate plugin config -- it accepted a
      # bogus field and reported "Updated: 1", which the control plane then
      # rejected. `validate` is online by default and catches it. Do NOT pass
      # --online-entities-list to narrow scope: with `Services` it silently
      # passed the same bad field.
      - name: validate config against the control plane
        env:
          DECK_KONNECT_TOKEN: ${{ secrets.KONNECT_PAT }}
          DECK_KONNECT_ADDR: https://us.api.konghq.com
        run: |
          cd deploy/konnect
          deck gateway validate kong.yaml \
            --konnect-control-plane-name skyflow-kong-gateway
