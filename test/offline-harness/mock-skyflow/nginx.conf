# Minimal mock of the Skyflow Detect De-identify API for the hybrid demo.
# Deterministic, reversible canned tokenization for a few fixtures; unknown
# text passes through unchanged. Matches the request/response shape the plugin
# expects (see docs/03-skyflow-integration.md §3.3).

server {
    listen 8080;
    default_type application/json;

    # POST /v1/auth/sts/token -- RFC 8693 token exchange.
    #
    # The plugin is STS-only: `credentials.api_key` was removed, and
    # `credentials.sts.service_account_id` is a required field. Without this
    # endpoint the offline demo cannot authenticate at all -- which is exactly
    # what happened when the STS refactor landed and this mock was not updated,
    # leaving Kong to abort at startup on an unknown `api_key` field.
    #
    # Accepts anything and mints a fixed bearer. The point of the offline harness
    # is the de-identify round trip, not the token exchange, and nothing
    # downstream inspects this value.
    location = /v1/auth/sts/token {
        content_by_lua_block {
            ngx.say('{"accessToken":"mock-sts-bearer","tokenType":"Bearer","expiresIn":3600}')
        }
    }

    # POST /v1/detect/deidentify/string
    location = /v2/detect/deidentify/string {
        content_by_lua_block {
            local cjson = require "cjson"
            ngx.req.read_body()
            local ok, body = pcall(cjson.decode, ngx.req.get_body_data() or "{}")
            local text = (ok and type(body) == "table" and body.text) or ""

            -- value -> { token, entity }. Opaque VAULT_TOKEN-style suffixes so the
            -- mock output looks like the real vault ([NAME_xjv74g], not [NAME_1]).
            local fixtures = {
                -- original fixtures
                ["Jane Doe"]         = { token = "NAME_aB3xQ",          entity = "NAME" },
                ["John Smith"]       = { token = "NAME_7yTla",          entity = "NAME" },
                ["jane@acme.com"]    = { token = "EMAIL_ADDRESS_kp2",   entity = "EMAIL_ADDRESS" },
                ["555-123-4567"]     = { token = "PHONE_NUMBER_Qq9",    entity = "PHONE_NUMBER" },
                ["123-45-6789"]      = { token = "SSN_0ykQWPA",         entity = "SSN" },
                ["4111111111111111"] = { token = "CREDIT_CARD_N92QAVa", entity = "CREDIT_CARD" },
                -- healthcare scenario (demo/scenarios/healthcare.sh)
                ["Maria Gonzalez"]        = { token = "NAME_xjv74g",                       entity = "NAME" },
                ["Elena Gonzalez"]        = { token = "NAME_p29mkd",                       entity = "NAME" },
                ["Dr."]                   = { token = "OCCUPATION_rk18",                    entity = "OCCUPATION" },
                ["Alan Reyes"]            = { token = "NAME_MEDICAL_PROFESSIONAL_r7qz2",    entity = "NAME_MEDICAL_PROFESSIONAL" },
                ["Mercy General Hospital"]= { token = "ORGANIZATION_MEDICAL_FACILITY_h4t8", entity = "ORGANIZATION_MEDICAL_FACILITY" },
                ["88213-A"]               = { token = "HEALTHCARE_NUMBER_m3k1c",            entity = "HEALTHCARE_NUMBER" },
                ["Type 2 diabetes"]       = { token = "CONDITION_c1aa9",                    entity = "CONDITION" },
                ["hypertension"]          = { token = "CONDITION_c2bb7",                    entity = "CONDITION" },
                ["metformin"]             = { token = "DRUG_d1cc4",                         entity = "DRUG" },
                ["lisinopril"]            = { token = "DRUG_d2dd8",                         entity = "DRUG" },
                ["500mg twice daily"]     = { token = "DOSE_e1f30",                         entity = "DOSE" },
                ["10mg"]                  = { token = "DOSE_e2g55",                         entity = "DOSE" },
                ["maria.g@example.com"]   = { token = "EMAIL_ADDRESS_g1h20",               entity = "EMAIL_ADDRESS" },
                ["elena.g@example.com"]   = { token = "EMAIL_ADDRESS_g2j41",               entity = "EMAIL_ADDRESS" },
                ["415-555-0132"]          = { token = "PHONE_NUMBER_ph9k1",                entity = "PHONE_NUMBER" },
                ["1984-03-12"]            = { token = "DOB_x1a90",                         entity = "DOB" },
                -- second patient (demo/act2/patient_intake.py)
                ["David Okafor"]          = { token = "NAME_qm55v",                        entity = "NAME" },
                ["Grace Okafor"]          = { token = "NAME_w81rp",                        entity = "NAME" },
                ["Sarah Lin"]             = { token = "NAME_MEDICAL_PROFESSIONAL_s3ln8",   entity = "NAME_MEDICAL_PROFESSIONAL" },
                ["77120-B"]               = { token = "HEALTHCARE_NUMBER_n7p2q",           entity = "HEALTHCARE_NUMBER" },
                ["asthma"]                = { token = "CONDITION_c3ee2",                    entity = "CONDITION" },
                ["high cholesterol"]      = { token = "CONDITION_c4ff6",                    entity = "CONDITION" },
                ["albuterol inhaler"]     = { token = "DRUG_d3gg1",                         entity = "DRUG" },
                ["atorvastatin"]          = { token = "DRUG_d4hh9",                         entity = "DRUG" },
                ["20mg"]                  = { token = "DOSE_e3k22",                         entity = "DOSE" },
                ["d.okafor@example.com"]  = { token = "EMAIL_ADDRESS_g3m10",               entity = "EMAIL_ADDRESS" },
                ["g.okafor@example.com"]  = { token = "EMAIL_ADDRESS_g4n55",               entity = "EMAIL_ADDRESS" },
                ["415-555-0177"]          = { token = "PHONE_NUMBER_ph2r7",                entity = "PHONE_NUMBER" },
                ["1971-11-02"]            = { token = "DOB_x2b71",                         entity = "DOB" },
            }

            local function esc(s) return (s:gsub("[%(%)%.%%%+%-%*%?%[%]%^%$]", "%%%1")) end

            -- Replace longest values first so a fixture that is a substring of
            -- another (e.g. a bare first name inside a full name) can't clobber it.
            local keys = {}
            for value in pairs(fixtures) do keys[#keys + 1] = value end
            table.sort(keys, function(a, b) return #a > #b end)

            local processed, entities = text, {}
            for _, value in ipairs(keys) do
                local m = fixtures[value]
                if processed:find(value, 1, true) then
                    processed = processed:gsub(esc(value), "[" .. m.token .. "]")
                    entities[#entities + 1] = {
                        token = m.token, value = value, entityType = m.entity,
                        entityScores = { [m.entity] = 0.99 },
                    }
                end
            end

            local _, words = text:gsub("%S+", "")
            ngx.say(cjson.encode({
                -- camelCase envelope, matching the real endpoint. The plugin reads
                -- `processedText`, and `entityType` on each entity.
                processedText = processed, entities = entities,
                metrics = { wordCount = words, characterCount = #text },
            }))
        }
    }

    # POST /v2/detect/reidentify/string
    # Reverses the canned tokens back to their values so the `reidentify_text`
    # strategy shows a full de-id -> LLM -> re-id round-trip against the mock.
    # Handles both bracketed ([TOKEN]) and bare (TOKEN) forms.
    location = /v2/detect/reidentify/string {
        content_by_lua_block {
            local cjson = require "cjson"
            ngx.req.read_body()
            local ok, body = pcall(cjson.decode, ngx.req.get_body_data() or "{}")
            local text = (ok and type(body) == "table" and body.text) or ""

            -- token -> value (inverse of the deidentify fixtures)
            local rev = {
                NAME_aB3xQ          = "Jane Doe",
                NAME_7yTla          = "John Smith",
                EMAIL_ADDRESS_kp2   = "jane@acme.com",
                PHONE_NUMBER_Qq9    = "555-123-4567",
                SSN_0ykQWPA         = "123-45-6789",
                CREDIT_CARD_N92QAVa = "4111111111111111",
                -- healthcare scenario
                NAME_xjv74g                        = "Maria Gonzalez",
                NAME_p29mkd                        = "Elena Gonzalez",
                OCCUPATION_rk18                    = "Dr.",
                NAME_MEDICAL_PROFESSIONAL_r7qz2    = "Alan Reyes",
                ORGANIZATION_MEDICAL_FACILITY_h4t8 = "Mercy General Hospital",
                HEALTHCARE_NUMBER_m3k1c            = "88213-A",
                CONDITION_c1aa9                    = "Type 2 diabetes",
                CONDITION_c2bb7                    = "hypertension",
                DRUG_d1cc4                         = "metformin",
                DRUG_d2dd8                         = "lisinopril",
                DOSE_e1f30                         = "500mg twice daily",
                DOSE_e2g55                         = "10mg",
                EMAIL_ADDRESS_g1h20                = "maria.g@example.com",
                EMAIL_ADDRESS_g2j41                = "elena.g@example.com",
                PHONE_NUMBER_ph9k1                 = "415-555-0132",
                DOB_x1a90                          = "1984-03-12",
                -- second patient
                NAME_qm55v                         = "David Okafor",
                NAME_w81rp                         = "Grace Okafor",
                NAME_MEDICAL_PROFESSIONAL_s3ln8    = "Sarah Lin",
                HEALTHCARE_NUMBER_n7p2q            = "77120-B",
                CONDITION_c3ee2                    = "asthma",
                CONDITION_c4ff6                    = "high cholesterol",
                DRUG_d3gg1                         = "albuterol inhaler",
                DRUG_d4hh9                         = "atorvastatin",
                DOSE_e3k22                         = "20mg",
                EMAIL_ADDRESS_g3m10                = "d.okafor@example.com",
                EMAIL_ADDRESS_g4n55                = "g.okafor@example.com",
                PHONE_NUMBER_ph2r7                 = "415-555-0177",
                DOB_x2b71                          = "1971-11-02",
            }

            local function esc(s) return (s:gsub("[%(%)%.%%%+%-%*%?%[%]%^%$]", "%%%1")) end

            local processed = text
            for token, value in pairs(rev) do
                processed = processed:gsub("%[" .. esc(token) .. "%]", value)  -- [TOKEN]
                processed = processed:gsub(esc(token), value)                  -- bare TOKEN
            end

            -- The real endpoint answers with `processedText`, same as de-identify.
            ngx.say(cjson.encode({ processedText = processed }))
        }
    }

    location / {
        content_by_lua_block {
            ngx.status = 404
            ngx.say('{"message":"mock-skyflow: unknown path"}')
        }
    }
}
