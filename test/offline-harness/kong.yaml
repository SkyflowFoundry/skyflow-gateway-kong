# Local db-less config. Three flows, all against the mocks:
#
#   /vault/chat       baseline (PROVEN): skyflow-ai-data-control de-id + re-id, upstream
#                     = mock-llm directly. No ai-proxy. Sanity check.
#
#   /broken/chat      REPRODUCES Kong #14380: skyflow-ai-data-control (de-id + re-id)
#                     and ai-proxy on ONE route. ai-proxy transforms the response
#                     in header_filter while the plugin's :response() phase also
#                     rewrites the buffered gzip body -> ai-proxy 500s with
#                     "no response body found when transforming response".
#
#   /ai/chat          THE FIX (nested proxy): front route runs de-id + re-id ONLY
#                     (proven /vault/chat plugin), and its upstream is the internal
#                     /_ai_upstream route which runs ai-proxy ALONE. Two routes =
#                     two independent buffered cycles = no collision.
#
#   /_ai_upstream     internal: ai-proxy -> mock LLM. No skyflow plugins.

_format_version: "3.0"

services:
  # -- baseline: proven de-id -> LLM -> re-id, no ai-proxy ------------------
  - name: vault-chat
    url: http://mock-llm:8080
    routes:
      - name: vault-chat
        paths: ["/vault/chat"]

        protocols: ["http", "https"]
        strip_path: true
    plugins:
      - name: skyflow-ai-data-control
        config: &skyflow_deid_reid
          vault_id: demo-vault
          cluster_id: demo
          skyflow_base_url_override: "http://mock-skyflow:8080"
          # `credentials.api_key` moved under `credentials.bearer_token` when the auth
          # this file kept it -- so Kong aborted at startup with
          # "in 'api_key': unknown field" and the 60-second demo could not run at
          # all. expected_issuer/expected_audience are deliberately UNSET here so
          # the harness accepts the fixture JWT below without an IdP; a real
          # deployment must set both (see deploy/streaming/kong.yaml).
          credentials:
            sts:
              service_account_id: "demo-service-account"
              token_uri: "http://mock-skyflow:8080/v1/auth/sts/token"
          profile: openai
          # The local mock
          # tokenizes by lookup table (ignores entity_types), so this list is for
          # parity; the healthcare values live in mock-skyflow/nginx.conf.
          deidentify:
            entities: [NAME, NAME_GIVEN, NAME_MEDICAL_PROFESSIONAL, OCCUPATION,
                       HEALTHCARE_NUMBER, ORGANIZATION_MEDICAL_FACILITY, CONDITION,
                       DRUG, DOSE, DOB, EMAIL_ADDRESS, PHONE_NUMBER]
            token_format: VAULT_TOKEN
          reidentify: { enabled: true, strategy: reidentify_text, default_treatment: plain_text }
          on_skyflow_error: deny

  # -- REPRO of the #14380 conflict: ai-proxy + a response-phase re-identify on
  #    ONE route. skyflow-ai-data-control does both de-id (access) AND re-id
  #    (response) here, so its response-phase body rewrite collides with
  #    ai-proxy's header_filter transform over the gzip body. => 500.
  - name: broken
    url: http://localhost:32000   # placeholder; ai-proxy overrides upstream
    routes:
      - name: broken-chat
        paths: ["/broken/chat"]
        protocols: ["http", "https"]
        strip_path: true
    plugins:
      - name: skyflow-ai-data-control
        config: *skyflow_deid_reid   # de-id + re-id on the SAME route as ai-proxy
      - name: ai-proxy
        config: &ai_proxy_mock
          route_type: "llm/v1/chat"
          max_request_body_size: 16777216   # agent-sized bodies (see demo/act2)
          auth: { header_name: Authorization, header_value: "Bearer sk-mock" }
          model:
            provider: openai
            name: gpt-4o-mini
            options:
              upstream_url: "http://mock-llm:8080/v1/chat/completions"

  # -- THE FIX: front route (de-id + re-id) -> internal ai-proxy route ------
  - name: ai-front
    # loopback to Kong's own proxy port; hits the /_ai_upstream route below.
    url: http://127.0.0.1:8000/_ai_upstream
    routes:
      # /ai/v1/chat/completions makes this an OpenAI-compatible endpoint for the
      # opencode coding-agent demo (base_url http://localhost:8010/ai/v1). Mirrors
      # real-vault.yaml; both paths strip to the same /_ai_upstream loopback.
      - name: ai-chat
        paths: ["/ai/chat", "/ai/v1/chat/completions"]

        protocols: ["http", "https"]
        strip_path: true
    plugins:
      - name: skyflow-ai-data-control
        config: *skyflow_deid_reid   # identical to the proven /vault/chat plugin

  - name: ai-upstream
    url: http://localhost:32000   # placeholder; ai-proxy overrides upstream
    routes:
      - name: ai-upstream
        paths: ["/_ai_upstream"]

        protocols: ["http", "https"]
        strip_path: true
    plugins:
      - name: ai-proxy
        config: *ai_proxy_mock
